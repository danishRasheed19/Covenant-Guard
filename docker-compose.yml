# Optional: local Postgres with pgvector. Untested; adjust if your setup differs.
# Run: docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: covenantguard
      POSTGRES_PASSWORD: covenantguard
      POSTGRES_DB: covenantguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  pgdata:
